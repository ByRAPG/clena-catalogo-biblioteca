# Despliegue de producción en una sola máquina (ver README, «Despliegue en
# producción»). Uso:
#   cp .env.prod.example .env.prod   # y rellenar los valores
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Solo `web` publica puertos (80 y 443). La base y la API quedan en una red
# interna sin salida a internet. No incluye la semilla de demostración.

services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 512m
    pids_limit: 200
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Define JWT_ACCESS_SECRET (mínimo 32 caracteres) en .env.prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Define JWT_REFRESH_SECRET (mínimo 32 caracteres) en .env.prod}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      # Mismo origen que sirve el frontend: no hay CORS entre dominios.
      CORS_ORIGIN: ${PUBLIC_WEB_URL:?Define PUBLIC_WEB_URL (p. ej. https://biblioteca.ejemplo.org) en .env.prod}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Un proxy de confianza (Caddy). La API lo lee desde el PR #109; antes se ignora.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Búsqueda semántica (ADR-08). Valores por defecto = los del código. Para activarla con el modelo real: SEMANTIC_SEARCH=on, EMBEDDING_PROVIDER=local.
      SEMANTIC_SEARCH: ${SEMANTIC_SEARCH:-off}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-/app/models}
      SEARCH_MIN_SIMILARITY: ${SEARCH_MIN_SIMILARITY:-0.84}
      SEARCH_RELATIVE_CUTOFF: ${SEARCH_RELATIVE_CUTOFF:-0.04}
      SEARCH_LEXICAL_WEIGHT: ${SEARCH_LEXICAL_WEIGHT:-2}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # Sin puertos publicados: solo `web` llega a la API por la red interna.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 300

  web:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100

networks:
  # Sin salida a internet: db, backend y web hablan entre sí.
  internal:
    internal: true
  # Red normal para publicar puertos y que Caddy pida el certificado (ACME).
  edge: {}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
