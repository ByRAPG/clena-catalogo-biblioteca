name: Historia de usuario
description: Necesidad de un usuario del CLENA (la redacta el Grupo 9)
title: "HU-XX · "
labels: ["historia-usuario"]
body:
  - type: markdown
    attributes:
      value: |
        Escribe la historia desde el punto de vista de quien usa el sistema. Guíate por `docs/backlog.md`.
        Al crearla, agrega la etiqueta de prioridad (`prioridad:alta`, `prioridad:media` o `prioridad:baja`) y luego comenta «Validada por el Grupo 9».
  - type: input
    id: rol
    attributes:
      label: Como...
      description: ¿Quién la necesita? (visitante, adulto mayor, estudiante, bibliotecario, administrador, lector)
      placeholder: visitante de la biblioteca
    validations:
      required: true
  - type: input
    id: quiero
    attributes:
      label: Quiero...
      placeholder: buscar escribiendo solo una parte del título
    validations:
      required: true
  - type: input
    id: para
    attributes:
      label: Para...
      placeholder: encontrar el libro aunque no recuerde el nombre exacto
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Entre 2 y 4, uno por línea, con el formato Dado / cuando / entonces.
      placeholder: |
        - Dado que existe «Cien años de soledad», cuando escribo «cien años sole», entonces aparece entre los 3 primeros resultados.
    validations:
      required: true
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad (MoSCoW)
      options:
        - Debe tener
        - Debería tener
        - Podría tener
        - No tendrá ahora
    validations:
      required: true
  - type: input
    id: puntos
    attributes:
      label: Puntos (los estima Backend)
      description: Fibonacci (1, 2, 3, 5, 8, 13).
      placeholder: "5"
  - type: textarea
    id: notas
    attributes:
      label: Notas o ejemplos del CLENA
      description: Lo que observaron en la biblioteca, fotos, datos de ejemplo, origen de la historia.
