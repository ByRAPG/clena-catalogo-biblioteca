name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  detectar:
    name: Detectar proyectos
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.d.outputs.backend }}
      frontend: ${{ steps.d.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        run: |
          [ -f backend/package.json ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (lint, test, build)
    needs: detectar
    if: needs.detectar.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: clena_test
          POSTGRES_PASSWORD: clena_test
          POSTGRES_DB: clena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://clena_test:clena_test@localhost:5432/clena_test?schema=public
      E2E_DATABASE_URL: postgresql://clena_test:clena_test@localhost:5432/clena_test?schema=public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prisma:migrate:deploy
      - name: Preparar semilla ficticia
        run: |
          export SEED_DEMO_PASSWORD="$(node -p "require('node:crypto').randomBytes(24).toString('hex')")"
          pnpm run prisma:seed
      - run: pnpm run lint
      - name: Pruebas unitarias con umbral de cobertura (domain y application)
        run: pnpm run test:cov --runInBand
      - run: pnpm run test:e2e --runInBand
      - run: pnpm run build

  frontend:
    name: Frontend (lint, test, build)
    needs: detectar
    if: needs.detectar.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - name: Pruebas con umbral de cobertura
        run: pnpm run test:cov
      - run: pnpm run build

  ci:
    name: CI
    if: always()
    needs: [detectar, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Resultado global
        run: |
          echo "backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }}"
          if [ "${{ needs.backend.result }}" = "failure" ] || [ "${{ needs.frontend.result }}" = "failure" ] || [ "${{ needs.backend.result }}" = "cancelled" ] || [ "${{ needs.frontend.result }}" = "cancelled" ]; then exit 1; fi
