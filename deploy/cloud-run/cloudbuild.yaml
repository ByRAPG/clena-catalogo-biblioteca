# Construye la imagen única con Cloud Build y la sube a Artifact Registry.
# Uso (desde la raíz del repo):
#   gcloud builds submit --region=us-east1 --config=deploy/cloud-run/cloudbuild.yaml .
substitutions:
  _REGION: us-east1
  _REPO: busca-facil
steps:
  - name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "deploy/cloud-run/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:latest", "."]
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:latest"
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
