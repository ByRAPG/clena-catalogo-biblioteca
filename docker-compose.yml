services:
  db:
    container_name: clena-db
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-clena_catalogo}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: clena-backend
    build: 
      context: ./backend
      target: development
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-clena}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-clena_catalogo}?schema=public"
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
  
  frontend:
    container_name: clena-frontend
    build: 
      context: ./frontend
      target: development
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts

  mailpit:
    container_name: clena-mailpit
    image: axllent/mailpit:v1.33.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data: